# Hevy Analytics behind nginx with a password (HTTP basic auth). Example: include it in your server { } block.
# Any authenticating proxy works the same way: it must set X-Remote-User itself and never pass a client's own copy.
#
#   sudo htpasswd -c /etc/nginx/hevy.htpasswd you        # create the login (apache2-utils)

location = /hevy { return 308 /hevy/$is_args$args; }

location ^~ /hevy/ {
    auth_basic "Training";
    auth_basic_user_file /etc/nginx/hevy.htpasswd;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8778;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Remote-User $remote_user;      # who logged in (overwrites anything the client sent)
    proxy_set_header Authorization "";                # the password never reaches the app
    proxy_set_header X-Hevy-Gpt-Key "";
}

# Optional: your own GPT in ChatGPT (docs/CHATGPT.md). ChatGPT's servers can't log in, so this path skips the password;
# the app refuses it without the key from `python -m hevy.cli gpt-key new`. Leave it out if you don't use it.
# Needs, in the http { } block:  limit_req_zone $binary_remote_addr zone=hevy_gpt:1m rate=10r/m;
location ^~ /hevy/gpt/ {
    limit_req zone=hevy_gpt burst=10 nodelay;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8778;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Hevy-Gpt-Key $http_authorization;
    proxy_set_header Authorization "";
}
